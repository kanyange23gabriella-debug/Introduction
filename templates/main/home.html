
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #d8b4fe, #93c5fd);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #292447;
        }

        .card {
            background: white;
            width: 80%;
            max-width: 550px;
            padding: 45px 30px;
            text-align: center;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        h1 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        h1 span {
            color: #8b5cf6;
        }

        p {
            color: #6b7280;
            font-size: 16px;
            line-height: 1.8;
        }

        .button {
            display: inline-block;
            background: #8b5cf6;
            color: white;
            text-decoration: none;
            padding: 13px 25px;
            border-radius: 10px;
            margin-top: 15px;
            transition: 0.3s;
        }

        .button:hover {
            background: #6d28d9;
            transform: translateY(-3px);
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Hello, <span>World!</span> 💜</h1>

        <p>
            Welcome to my first Django website!
            I'm learning how to build beautiful websites
            using HTML, CSS and Python.
        </p>

        <a href="about.html" class="button">About Us</a>

        <p id="about">
            This website was created using Django.
            More amazing things are coming soon!
        </p>
    </div>
</body>
</html>
