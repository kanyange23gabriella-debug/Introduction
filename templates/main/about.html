
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #d8b4fe, #93c5fd);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #292447;
        }

        .card {
            background: white;
            width: 80%;
            max-width: 600px;
            padding: 40px;
            text-align: center;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #8b5cf6;
            font-size: 36px;
        }

        p {
            color: #6b7280;
            font-size: 16px;
            line-height: 1.8;
        }

        .button {
            display: inline-block;
            background: #8b5cf6;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 10px;
            margin-top: 20px;
            transition: 0.3s;
        }

        .button:hover {
            background: #6d28d9;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>About Us 💜</h1>

        <p>
            Welcome to our website! We created this platform
            to share our ideas, learn new things, and explore
            the exciting world of web development.
        </p>

        <p>
            Our goal is to make every visit simple, enjoyable,
            and meaningful. This is only the beginning!
        </p>

        <a href="/" class="button">← Back to Home</a>
    </div>
</body>
</html>
